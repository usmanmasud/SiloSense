databases:
  - name: silosense-db
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  - type: web
    name: silosense
    runtime: node
    rootDir: silosense
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: silosense-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SILOSENSE_ADMIN_EMAILS
        sync: false
