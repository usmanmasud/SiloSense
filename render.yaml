services:
  - type: web
    name: silosense
    runtime: node
    rootDir: silosense
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SILOSENSE_DATA_DIR
        value: /var/data
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
    disk:
      name: silosense-data
      mountPath: /var/data
      sizeGB: 1
